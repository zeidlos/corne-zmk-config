# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"

# Underglow off: the right (central) half drives its Y/H LEDs through the status
# LED module (src/status_leds.c); all other LEDs, and the left half, stay dark.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP=y
