# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Keyboard name (max. 16 characters). Must be set: the board has no default
# (it moved here in 9793e92), and without one the keyboard advertises
# nameless, which macOS and Android hide from their pairing lists.
CONFIG_ZMK_KEYBOARD_NAME="Corne Choc BT"

# Underglow off: the right (central) half drives its Y/H LEDs through the status
# LED module (src/status_leds.c); all other LEDs, and the left half, stay dark.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP=y
